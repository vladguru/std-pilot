packages:
  - apps/*
  - packages/*

# pnpm по умолчанию не запускает скрипты установки зависимостей; разрешены только перечисленные пакеты.
allowBuilds:
  unrs-resolver: true
  sharp: true

# Исправленные версии транзитивных зависимостей с известными уязвимостями (osv-scanner, 28.10.2026).
overrides:
  qs: ">=6.16.1"

# Защита цепочки поставки (правила semgrep): без нестандартных источников, свежие выпуски — не раньше чем через сутки.
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
