[mcp_servers.serena]
command = "uvx"
args = ["--from", "serena-agent==2.1.0", "serena", "start-mcp-server", "--context", "codex", "--project", "."]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.4.4"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--headless"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.12.0", "--headless"]

[mcp_servers.postgres]
command = "uvx"
args = ["--overrides", ".agents/postgres-mcp-overrides.txt", "--from", "postgres-mcp==0.3.0", "postgres-mcp", "--access-mode=restricted"]
env_vars = ["DATABASE_URI"]

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.render]
url = "https://mcp.render.com/mcp"
bearer_token_env_var = "RENDER_API_KEY"

[mcp_servers.neon]
url = "https://mcp.neon.tech/mcp"
bearer_token_env_var = "NEON_API_KEY"
# <<< agent-standard <<<
