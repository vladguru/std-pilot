# Проверка согласования (спека, п. 2): PR с меткой «на-согласовании», изменяющий SPEC.md, визуальное направление
# или ограничители, не сливается без одобрения владельца. Результат — статус коммита «std/согласование»
# (его требует защита ветки main). Файл принадлежит стандарту.
#
# Безопасность: проверка запускается из основной ветки (pull_request_target не выполняет код PR; для остальных событий
# явно берётся main), а учётную запись владельца скрипт читает из AGENTS.md ветки main через API.
name: Согласование

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  approval:
    name: Согласование
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/std
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/std/approval.mjs --post-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
