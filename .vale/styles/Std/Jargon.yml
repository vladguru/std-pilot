extends: substitution
message: "Используйте «%s» вместо «%s»."
level: error
ignorecase: true
swap:
  '\b(задепло\p{L}*)\b': развернуть
  '\b(деплой\p{L}*)\b': развёртывание
  '\b(пофикс\p{L}*)\b': исправить
  '\b(фич(?:а|и|у|е|ей|ам|ами|ах))\b': функция
  '\b(юзер\p{L}*)\b': пользователь
  '\b(баг|бага|багу|багом|баге|баги|багов|багам|багами|багах)\b': ошибка
  '\b(таска|таски|таску|таской|таске|тасков|таскам|тасками|тасках)\b': задание
  '\b(тикет\p{L}*)\b': задание
  '\b(дедлайн\p{L}*)\b': срок
  '\b(апрув\p{L}*|заапрув\p{L}*)\b': одобрение
  '\b(митинг\p{L}*)\b': встреча
